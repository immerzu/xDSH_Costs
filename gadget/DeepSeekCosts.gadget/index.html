<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>DeepSeek Costs</title>
<style type="text/css">
html, body {
  margin: 0px;
  padding: 0px;
  width: 130px;
  height: 57px;
  overflow: hidden;
  background-color: transparent;
  cursor: pointer;
}
#c {
  position: absolute;
  left: 0px;
  top: 0px;
  width: 130px;
  height: 57px;
}
</style>
<script type="text/javascript">
/* ES3 — Gadget-Engine ist alt: kein let/const, keine Pfeilfunktionen. */

var TOKEN_REL = "\\.config\\opencode\\secrets\\deepseek-platform-token";
var REFRESH_MS = 5 * 60 * 1000;
var busy = false;
var peakImg = new Image();
peakImg.src = "src/peak2x.png";

function el(id) { return document.getElementById(id); }

function fso() {
  try { return new ActiveXObject("Scripting.FileSystemObject"); } catch (e) { return null; }
}

function homeDir() {
  try { return System.Environment.getEnvironmentVariable("USERPROFILE"); } catch (e) {}
  try { return new ActiveXObject("WScript.Shell").ExpandEnvironmentStrings("%USERPROFILE%"); } catch (e) {}
  return "";
}

function trim(s) { return String(s).replace(/^\s+|\s+$/g, ""); }

function parseJson(text) {
  try { return JSON.parse(text); } catch (e) {}
  return eval("(" + text + ")");
}

function parseToken(raw) {
  if (!raw) return null;
  var t = trim(raw);
  if (!t) return null;
  if (t.charAt(0) === "{") {
    try {
      var o = parseJson(t);
      var keys = ["value", "token", "access_token", "accessToken", "userToken"];
      for (var i = 0; i < keys.length; i++) {
        var v = o[keys[i]];
        if (typeof v === "string" && v.length >= 20 && !/\s/.test(v)) return v;
      }
      return null;
    } catch (e) { return null; }
  }
  return t.length >= 20 && !/\s/.test(t) ? t : null;
}

function readToken() {
  var f = fso();
  if (!f) return null;
  try {
    var path = homeDir() + TOKEN_REL;
    if (!f.FileExists(path)) return null;
    var s = f.OpenTextFile(path, 1, false);
    var text = s.ReadAll();
    s.Close();
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = trim(lines[i]);
      if (line && line.charAt(0) !== "#") return parseToken(line);
    }
  } catch (e) {}
  return null;
}

function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (typeof v !== "string") return null;
  var c = trim(v).replace(/,/g, "");
  if (!c) return null;
  var n = Number(c);
  return isFinite(n) ? n : null;
}

function isPeak(d) {
  var day = d.getUTCDay();
  if (day === 0 || day === 6) return false;
  var h = d.getUTCHours();
  return (h >= 1 && h < 4) || (h >= 6 && h < 10);
}

function money(v) {
  if (v === null || v === undefined || v < 0) return "--";
  return "$" + v.toFixed(2);
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }

function dayIso(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

function httpGet(url, token) {
  var x = null;
  try { x = new ActiveXObject("MSXML2.XMLHTTP"); } catch (e) {}
  if (!x) { try { x = new ActiveXObject("Microsoft.XMLHTTP"); } catch (e) { return null; } }
  try {
    x.open("GET", url, false);
    x.setRequestHeader("Accept", "application/json");
    x.setRequestHeader("Authorization", "Bearer " + token);
    x.send();
    return { status: x.status, body: x.responseText };
  } catch (e) {
    return { status: 0, body: "" };
  }
}

function walletsFrom(json) {
  var biz = json && json.data && json.data.biz_data;
  if (!biz) return null;
  var normal = biz.normal_wallets || [];
  var bonus = biz.bonus_wallets || [];
  var i, sumNormal = 0, sumBonus = 0, found = false;
  for (i = 0; i < normal.length; i++) {
    if (String(normal[i].currency).toUpperCase() === "USD") { sumNormal += num(normal[i].balance) || 0; found = true; }
  }
  for (i = 0; i < bonus.length; i++) {
    if (String(bonus[i].currency).toUpperCase() === "USD") { sumBonus += num(bonus[i].balance) || 0; found = true; }
  }
  if (!found && normal.length) {
    sumNormal = num(normal[0].balance) || 0;
    found = true;
  }
  if (!found) return null;
  return { toppedUp: sumNormal, granted: sumBonus, total: sumNormal + sumBonus };
}

function dayCost(json, day) {
  var raw = json && json.data && json.data.biz_data;
  if (!raw) return null;
  var rows = raw.length ? raw : [raw];
  var row = rows[0], i;
  for (i = 0; i < rows.length; i++) {
    if (String(rows[i].currency).toUpperCase() === "USD") { row = rows[i]; break; }
  }
  var days = row.days || [];
  var monthPrefix = String(day).substring(0, 7);
  var month = 0, monthSeen = false, todayValue = null;
  for (i = 0; i < days.length; i++) {
    var date = String(days[i].date || "");
    if (date.substring(0, 7) !== monthPrefix) continue;
    var parts = days[i].data || [];
    var j, k, total = 0, seen = false;
    for (j = 0; j < parts.length; j++) {
      var usage = parts[j].usage || [];
      for (k = 0; k < usage.length; k++) {
        if (String(usage[k].type).toUpperCase() === "REQUEST") continue;
        var v = num(usage[k].amount);
        if (v !== null) { total += v; seen = true; }
      }
    }
    if (seen) { month += total; monthSeen = true; }
    if (date === day && seen) todayValue = total;
  }
  return { today: todayValue, month: monthSeen ? month : null };
}

var bgImg = new Image();
var bgReady = false;
bgImg.onload = function () { bgReady = true; refresh(); };
bgImg.src = "src/background.png";

function draw(kind, balance, cost) {
  var cv = el("c");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 260, 114);
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  if (bgReady) ctx.drawImage(bgImg, 0, 0, 130, 57);

  var colors = { ok: "#3ddc84", none: "#e8c341", auth: "#ff6b6b", error: "#ff6b6b" };
  ctx.beginPath();
  ctx.arc(11, 26, 4, 0, Math.PI * 2);
  ctx.fillStyle = colors[kind] || "#8a8a8a";
  ctx.fill();

  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 13px Tahoma";
  ctx.fillText(balance, 20, 26);
  var w = ctx.measureText(balance).width;
  ctx.font = "9px Tahoma";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(cost, 20 + w + 6, 26);

  if (isPeak(new Date()) && peakImg.complete && peakImg.width > 0) {
    ctx.drawImage(peakImg, 118, 20, 9, 13);
  }
}

function refresh() {
  if (busy) return;
  busy = true;
  try {
    var token = readToken();
    if (!token) { draw("none", "Token fehlt", ""); return; }
    var now = new Date();
    var s = httpGet("https://platform.deepseek.com/api/v0/users/get_user_summary", token);
    var c = httpGet("https://platform.deepseek.com/api/v0/usage/cost?month=" + (now.getMonth() + 1) + "&year=" + now.getFullYear(), token);
    if (!s || s.status !== 200) { draw("error", "Fehler " + (s ? s.status : "?"), ""); return; }
    var sj = null, cj = null;
    try { sj = parseJson(s.body); } catch (e) {}
    var w = walletsFrom(sj);
    if (!w) {
      var code = sj && sj.code;
      draw((code === 40002 || code === 40003) ? "auth" : "error", "Token ung\u00fcltig", "");
      return;
    }
    if (c && c.status === 200) { try { cj = parseJson(c.body); } catch (e) {} }
    var d = dayCost(cj, dayIso(now));
    draw("ok", money(w.total), "\u00b7 heute " + money(d ? d.today : null));
  } catch (e) {
    draw("error", "Fehler", "");
  } finally {
    busy = false;
  }
}

function openUsage() {
  try {
    var sh = new ActiveXObject("WScript.Shell");
    sh.Run("cmd /c start \"\" \"https://platform.deepseek.com/usage\"", 0, false);
    return;
  } catch (e) {}
  try { System.Shell.execute("https://platform.deepseek.com/usage"); } catch (e) {}
}

window.onload = function () {
  refresh();
  setInterval(refresh, REFRESH_MS);
};
</script>
</head>
<body onclick="openUsage()"><g:background id="bg" opacity="0%" /><canvas id="c" width="260" height="114"></canvas></body>
</html>
