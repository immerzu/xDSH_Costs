<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>DeepSeek Costs</title>
<style type="text/css">
html, body {
  margin: 0px;
  padding: 0px;
  width: 130px;
  height: 57px;
  overflow: hidden;
  background-color: transparent;
}
</style>
<script type="text/javascript">
/* Native Sidebar-Grafik: g:background.addTextObject / addImageObject.
   Kein Canvas, kein HTML-Text -> keine ClearType-Farbsaeume. */

var TOKEN_REL = "\\.config\\opencode\\secrets\\deepseek-platform-token";
var REFRESH_MS = 5 * 60 * 1000;
var busy = false;

var bg = null, txtBal = null, txtCost = null, txtLed = null, imgPeak = null;

function log(msg) {
  try {
    var fso = new ActiveXObject("Scripting.FileSystemObject");
    var f = fso.OpenTextFile(fso.GetSpecialFolder(2) + "\\deepseekcosts.log", 8, true);
    f.WriteLine(new Date().toTimeString().substring(0, 8) + " " + msg);
    f.Close();
  } catch (e) {}
}

function fso() {
  try { return new ActiveXObject("Scripting.FileSystemObject"); } catch (e) { return null; }
}

function homeDir() {
  try { return System.Environment.getEnvironmentVariable("USERPROFILE"); } catch (e) {}
  try { return new ActiveXObject("WScript.Shell").ExpandEnvironmentStrings("%USERPROFILE%"); } catch (e) {}
  return "";
}

function trim(s) { return String(s).replace(/^\s+|\s+$/g, ""); }

function parseJson(text) {
  try { return JSON.parse(text); } catch (e) {}
  return eval("(" + text + ")");
}

function parseToken(raw) {
  if (!raw) return null;
  var t = trim(raw);
  if (!t) return null;
  if (t.charAt(0) === "{") {
    try {
      var o = parseJson(t);
      var keys = ["value", "token", "access_token", "accessToken", "userToken"];
      for (var i = 0; i < keys.length; i++) {
        var v = o[keys[i]];
        if (typeof v === "string" && v.length >= 20 && !/\s/.test(v)) return v;
      }
      return null;
    } catch (e) { return null; }
  }
  return t.length >= 20 && !/\s/.test(t) ? t : null;
}

function readToken() {
  var f = fso();
  if (!f) return null;
  try {
    var path = homeDir() + TOKEN_REL;
    if (!f.FileExists(path)) return null;
    var s = f.OpenTextFile(path, 1, false);
    var text = s.ReadAll();
    s.Close();
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = trim(lines[i]);
      if (line && line.charAt(0) !== "#") return parseToken(line);
    }
  } catch (e) {}
  return null;
}

function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (typeof v !== "string") return null;
  var c = trim(v).replace(/,/g, "");
  if (!c) return null;
  var n = Number(c);
  return isFinite(n) ? n : null;
}

/* Chinesische Feiertage: Amtlicher Jahresplan 2026 plus gesetzliche Kerntage.
   Quelle: Userscript xDSH Costs (CHINA_HOLIDAY_RANGES). */
var CHINA_HOLIDAY_RANGES = {
  2026: [
    ["2026-01-01", "2026-01-03"],
    ["2026-02-15", "2026-02-23"],
    ["2026-04-04", "2026-04-06"],
    ["2026-05-01", "2026-05-05"],
    ["2026-06-19", "2026-06-21"],
    ["2026-09-25", "2026-09-27"],
    ["2026-10-01", "2026-10-07"]
  ],
  /* 2027: Feste Termine aus der Bekanntmachung des Staatsrats (05.-13.02. Fruehlingsfest,
     03.-05.04. Qingming, 01.-05.05. Tag der Arbeit, 01.-07.10. Nationalfeiertag).
     Drachenboot und Mondfest sind in den Quellen als geschaetzt markiert. */
  2027: [
    ["2027-01-01", "2027-01-03"],
    ["2027-02-05", "2027-02-13"],
    ["2027-04-03", "2027-04-05"],
    ["2027-05-01", "2027-05-05"],
    ["2027-06-09", "2027-06-11"],
    ["2027-09-15", "2027-09-17"],
    ["2027-10-01", "2027-10-07"]
  ]
};

function utcDayIso(d) {
  var p = function (n) { return n < 10 ? "0" + n : "" + n; };
  return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate());
}

function isStatutoryChineseHoliday(dayIso) {
  var md = String(dayIso).substring(5);
  if (md === "01-01" || md === "05-01" || md === "10-01" || md === "10-02" || md === "10-03") return true;
  var year = Number(String(dayIso).substring(0, 4));
  if (md.substring(0, 3) === "04-") {
    var yy = year % 100;
    var qingming = Math.floor(yy * 0.2422 + 4.81) - Math.floor(yy / 4);
    if (Number(md.substring(3)) === qingming) return true;
  }
  return false;
}

function isChineseHolidayUtc(d) {
  var day = utcDayIso(d);
  var year = day.substring(0, 4);
  var list = CHINA_HOLIDAY_RANGES[year];
  if (list) {
    for (var i = 0; i < list.length; i++) {
      if (day >= list[i][0] && day <= list[i][1]) return true;
    }
  }
  return isStatutoryChineseHoliday(day);
}

/* Peak: Mo-Fr 01:00-04:00 und 06:00-10:00 UTC, ohne chinesische Feiertage. */
function isPeak(d) {
  var day = d.getUTCDay();
  if (day === 0 || day === 6) return false;
  if (isChineseHolidayUtc(d)) return false;
  var h = d.getUTCHours();
  return (h >= 1 && h < 4) || (h >= 6 && h < 10);
}

function money(v) {
  if (v === null || v === undefined || v < 0) return "--";
  return "$" + v.toFixed(2);
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }

function dayIso(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

function httpGet(url, token) {
  var x = null;
  try { x = new ActiveXObject("MSXML2.XMLHTTP"); } catch (e) {}
  if (!x) { try { x = new ActiveXObject("Microsoft.XMLHTTP"); } catch (e) { return null; } }
  try {
    x.open("GET", url, false);
    x.setRequestHeader("Accept", "application/json");
    x.setRequestHeader("Authorization", "Bearer " + token);
    x.send();
    return { status: x.status, body: x.responseText };
  } catch (e) {
    return { status: 0, body: "" };
  }
}

function walletsFrom(json) {
  var biz = json && json.data && json.data.biz_data;
  if (!biz) return null;
  var normal = biz.normal_wallets || [];
  var bonus = biz.bonus_wallets || [];
  var i, sumNormal = 0, sumBonus = 0, found = false;
  for (i = 0; i < normal.length; i++) {
    if (String(normal[i].currency).toUpperCase() === "USD") { sumNormal += num(normal[i].balance) || 0; found = true; }
  }
  for (i = 0; i < bonus.length; i++) {
    if (String(bonus[i].currency).toUpperCase() === "USD") { sumBonus += num(bonus[i].balance) || 0; found = true; }
  }
  if (!found && normal.length) { sumNormal = num(normal[0].balance) || 0; found = true; }
  if (!found) return null;
  return { toppedUp: sumNormal, granted: sumBonus, total: sumNormal + sumBonus };
}

function dayCost(json, day) {
  var raw = json && json.data && json.data.biz_data;
  if (!raw) return null;
  var rows = raw.length ? raw : [raw];
  var row = rows[0], i;
  for (i = 0; i < rows.length; i++) {
    if (String(rows[i].currency).toUpperCase() === "USD") { row = rows[i]; break; }
  }
  var days = row.days || [];
  var monthPrefix = String(day).substring(0, 7);
  var month = 0, monthSeen = false, todayValue = null;
  for (i = 0; i < days.length; i++) {
    var date = String(days[i].date || "");
    if (date.substring(0, 7) !== monthPrefix) continue;
    var parts = days[i].data || [];
    var j, k, total = 0, seen = false;
    for (j = 0; j < parts.length; j++) {
      var usage = parts[j].usage || [];
      for (k = 0; k < usage.length; k++) {
        if (String(usage[k].type).toUpperCase() === "REQUEST") continue;
        var v = num(usage[k].amount);
        if (v !== null) { total += v; seen = true; }
      }
    }
    if (seen) { month += total; monthSeen = true; }
    if (date === day && seen) todayValue = total;
  }
  return { today: todayValue, month: monthSeen ? month : null };
}

function colorFor(kind) {
  if (kind === "ok") return "LimeGreen";
  if (kind === "none") return "Gold";
  return "Red";
}

function show(kind, balance, cost) {
  try {
    if (!bg) bg = document.getElementById("bg");
    if (!bg) return;
    if (!txtBal) txtBal = bg.addTextObject("", "Segoe UI Semibold", 13, "White", 12, 16.5);
    if (!txtCost) txtCost = bg.addTextObject("", "Segoe UI Semibold", 10, "White", 56, 19);
    if (!txtLed) txtLed = bg.addTextObject("\u25CF", "Tahoma", 10, "LimeGreen", 4, 18);
    try { txtBal.value = balance; } catch (e) { log("bal ERR " + e.message); }
    try { txtCost.value = cost; } catch (e) { log("cost ERR " + e.message); }
    try { txtLed.color = colorFor(kind); } catch (e) { log("ledcolor ERR " + e.message); }
    try {
      var want = (isPeak(new Date()) && kind === "ok") ? "src/background_flame.png" : "src/background.png";
      if (bg.src !== want) bg.src = want;
    } catch (e) { log("bg.src ERR " + e.message); }  } catch (e) {
    log("show: " + e.message);
  }
}

function refresh() {
  if (busy) return;
  busy = true;
  try {
    var token = readToken();
    if (!token) { show("none", "Token fehlt", ""); return; }
    var now = new Date();
    var s = httpGet("https://platform.deepseek.com/api/v0/users/get_user_summary", token);
    var c = httpGet("https://platform.deepseek.com/api/v0/usage/cost?month=" + (now.getMonth() + 1) + "&year=" + now.getFullYear(), token);
    if (!s || s.status !== 200) { show("error", "Fehler " + (s ? s.status : "?"), ""); return; }
    var sj = null, cj = null;
    try { sj = parseJson(s.body); } catch (e) {}
    var w = walletsFrom(sj);
    if (!w) {
      var code = sj && sj.code;
      show((code === 40002 || code === 40003) ? "auth" : "error", "Token ung\u00fcltig", "");
      return;
    }
    if (c && c.status === 200) { try { cj = parseJson(c.body); } catch (e) {} }
    var d = dayCost(cj, dayIso(now));
    show("ok", money(w.total), "\u00b7 heute " + money(d ? d.today : null));
  } catch (e) {
    log("refresh: " + e.message);
    show("error", "Fehler", "");
  } finally {
    busy = false;
  }
}

function openUsage() {
  try {
    var sh = new ActiveXObject("WScript.Shell");
    sh.Run("cmd /c start \"\" \"https://platform.deepseek.com/usage\"", 0, false);
    return;
  } catch (e) {}
  try { System.Shell.execute("https://platform.deepseek.com/usage"); } catch (e) {}
}

function init() {
  bg = document.getElementById("bg");
  log("init: bg=" + (bg ? "ja" : "nein") + " addImageObject=" + (bg && typeof bg.addImageObject) + " removeObject=" + (bg && typeof bg.removeObject));
  txtBal = bg.addTextObject("", "Segoe UI Semibold", 13, "White", 12, 16.5);
  txtCost = bg.addTextObject("", "Segoe UI Semibold", 10, "White", 56, 19);
  show("ok", "...", "");
  refresh();
  setInterval(refresh, REFRESH_MS);
}
</script>
</head>
<body onload="init()" onclick="openUsage()"><g:background id="bg" src="src/background.png"></g:background></body>
</html>
